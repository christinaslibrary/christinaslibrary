<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Athenaeum — The Ultimate Library Catalog</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@600&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#cba135;
  --gold-light:#f0d78c;
  --wood-dark:#120d09;
  --wood:#241812;
  --wood-mid:#3a271b;
  --wood-light:#5a3d29;
  --cream:#f3e9d4;
  --cream-dim:#cfc2a3;
  --leather:#5c2626;
  --emerald:#2f6d5e;
  --shadow:rgba(0,0,0,.65);
}
*{box-sizing:border-box;}
html,body{
  background:radial-gradient(ellipse at top, #2a1c12 0%, #0e0a06 65%, #05030200 100%);
  background-color:var(--wood-dark);
  color:var(--cream);
  font-family:'EB Garamond', serif;
  min-height:100vh;
  overflow-x:hidden;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--wood-dark);}
::-webkit-scrollbar-thumb{background:var(--wood-light);border-radius:10px;border:2px solid var(--wood-dark);}
::-webkit-scrollbar-thumb:hover{background:var(--gold);}

.font-display{font-family:'Playfair Display', serif;}
.font-hand{font-family:'Caveat', cursive;}

body::before{
  content:'';
  position:fixed;inset:0;z-index:9999;pointer-events:none;
  opacity:.045;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

.gold-text{
  background:linear-gradient(180deg, #fff6da 0%, var(--gold-light) 35%, var(--gold) 55%, #8a651c 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.6));
}
.hidden{display:none !important;}

/* ============ LOCK SCREEN ============ */
#lockscreen{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:
    radial-gradient(circle at 50% 30%, rgba(203,161,53,.08), transparent 60%),
    linear-gradient(160deg, #1a120b, #060403 80%);
  transition:opacity 1s cubic-bezier(.7,0,.3,1), filter 1s cubic-bezier(.7,0,.3,1), transform 1s cubic-bezier(.7,0,.3,1);
}
#lockscreen.unlocking{opacity:0;filter:blur(25px);transform:scale(1.15);}
.lock-emblem{
  width:90px;height:90px;border:2px solid var(--gold);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 25px rgba(203,161,53,.4), inset 0 0 15px rgba(203,161,53,.2);
  animation:emberPulse 3s ease-in-out infinite;
  margin-bottom:1.2rem;
}
@keyframes emberPulse{
  0%,100%{box-shadow:0 0 25px rgba(203,161,53,.35), inset 0 0 15px rgba(203,161,53,.15);}
  50%{box-shadow:0 0 45px rgba(203,161,53,.6), inset 0 0 20px rgba(203,161,53,.3);}
}
#pin-container{display:flex;gap:16px;margin-top:2rem;}
.pin-box{
  width:58px;height:70px;text-align:center;font-size:2rem;font-family:'Playfair Display',serif;
  background:rgba(255,255,255,.03);
  border:1.5px solid rgba(203,161,53,.35);
  border-radius:10px;color:var(--cream-dim);
  backdrop-filter:blur(6px);
  transition:all .25s ease;
  caret-color:var(--gold);
}
.pin-box:focus{
  outline:none;border-color:var(--gold);color:var(--gold-light);
  box-shadow:0 0 18px rgba(203,161,53,.5);
  transform:translateY(-3px);
}
.error-glow{border-color:#ff4444 !important;box-shadow:0 0 20px 4px rgba(255,50,50,.55) !important; color:#ffb3b3 !important;}
@keyframes shake{
  10%,90%{transform:translateX(-2px);}
  20%,80%{transform:translateX(4px);}
  30%,50%,70%{transform:translateX(-9px);}
  40%,60%{transform:translateX(9px);}
}
.shake{animation:shake .6s cubic-bezier(.36,.07,.19,.97) both;}

/* ============ APP LAYOUT ============ */
#app{min-height:100vh;}
header.top-header{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg, rgba(18,13,9,.97), rgba(18,13,9,.85));
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(203,161,53,.25);
}
.stat-pill{
  background:rgba(203,161,53,.08);
  border:1px solid rgba(203,161,53,.3);
  border-radius:999px;padding:.25rem .85rem;font-size:.78rem;letter-spacing:.03em;
  color:var(--cream-dim);
}
.btn-gold{
  background:linear-gradient(180deg,var(--gold-light),var(--gold));
  color:#2a1c0d;font-weight:600;border-radius:10px;
  box-shadow:0 4px 15px rgba(203,161,53,.35), inset 0 1px 0 rgba(255,255,255,.5);
  transition:all .2s ease;
}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(203,161,53,.5);}
.btn-gold:active{transform:translateY(0);}
.btn-ghost{
  background:rgba(255,255,255,.04);border:1px solid rgba(203,161,53,.3);
  color:var(--cream-dim);border-radius:10px;transition:all .2s ease;
}
.btn-ghost:hover{background:rgba(203,161,53,.15);color:var(--gold-light);border-color:var(--gold);}
.btn-ghost.active{background:rgba(203,161,53,.25);color:var(--gold-light);border-color:var(--gold);}

.chip{
  padding:.4rem 1rem;border-radius:999px;font-size:.85rem;cursor:pointer;
  border:1px solid rgba(203,161,53,.25);color:var(--cream-dim);
  transition:all .2s ease; white-space:nowrap;
}
.chip:hover{border-color:var(--gold);color:var(--gold-light);}
.chip.active{background:var(--gold);color:#241608;font-weight:600;border-color:var(--gold);}

select, input.search-input{
  background:rgba(255,255,255,.04);border:1px solid rgba(203,161,53,.3);
  color:var(--cream);border-radius:10px;
}
select:focus, input.search-input:focus{outline:none;border-color:var(--gold);}

/* ============ GRID BOOK CARDS ============ */
#grid-view{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:2.2rem 1.4rem;
  padding:2rem 1.2rem 5rem;
}
@media(min-width:640px){#grid-view{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){#grid-view{grid-template-columns:repeat(4,1fr);}}
@media(min-width:1200px){#grid-view{grid-template-columns:repeat(5,1fr);}}
@media(min-width:1600px){#grid-view{grid-template-columns:repeat(7,1fr);gap:2.6rem 1.8rem;}}

.book-item{
  perspective:1300px;
  aspect-ratio:2/3;
  cursor:pointer;
  position:relative;
}
.book-inner{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transform:rotateY(-14deg) rotateX(1deg);
  transition:transform .55s cubic-bezier(.16,1,.3,1);
}
.face-front{
  position:absolute;inset:0;
  transform:translateZ(9px);
  border-radius:2px 8px 8px 2px;
  overflow:hidden;
  background-size:cover;background-position:center;
  box-shadow:
    0 20px 35px -10px var(--shadow),
    0 3px 8px rgba(0,0,0,.5);
  background-color:#3a271b;
  border:1px solid rgba(0,0,0,.4);
}
.face-front .cover-img{width:100%;height:100%;object-fit:cover;display:block;}
.face-front .no-cover{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.5rem;
  background:linear-gradient(160deg,var(--wood-light),var(--wood));
  padding:10px;text-align:center;
}
.face-front .no-cover span{font-family:'Playfair Display',serif;font-size:.85rem;color:var(--gold-light);line-height:1.2;}
.sheen{
  position:absolute;inset:0;pointer-events:none;opacity:0;
  transition:opacity .3s ease;
  mix-blend-mode:overlay;
}
.face-spine{
  position:absolute;left:0;top:0;width:18px;height:100%;
  transform-origin:left center;
  transform:rotateY(-90deg) translateZ(0px);
  background:linear-gradient(90deg, rgba(0,0,0,.55), rgba(255,255,255,.12) 45%, rgba(0,0,0,.6));
}
.face-pages{
  position:absolute;right:0;top:1.5%;width:16px;height:97%;
  transform-origin:right center;
  transform:rotateY(90deg) translateZ(9px);
  background:repeating-linear-gradient(180deg,#e9e2cf 0 2px,#c9c0a2 2px 3px);
  box-shadow:inset 0 0 6px rgba(0,0,0,.4);
}
.ribbon{
  position:absolute;top:8px;right:-6px;z-index:5;
  padding:3px 10px 3px 8px;font-size:.65rem;font-weight:700;letter-spacing:.05em;
  color:#fff; text-transform:uppercase;
  box-shadow:0 3px 6px rgba(0,0,0,.5);
  transform:translateZ(20px);
}
.ribbon.lent{background:linear-gradient(90deg,#8f2e2e,#5c1c1c);}
.ribbon.reading{background:linear-gradient(90deg,#1f5f7a,#123648);}
.book-meta{margin-top:.7rem;text-align:center;padding:0 4px;}
.book-meta h3{font-family:'Playfair Display',serif;font-size:.92rem;color:var(--cream);line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.book-meta p{font-size:.78rem;color:var(--cream-dim);margin-top:2px;font-style:italic;}
.progress-mini{height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:6px;overflow:hidden;}
.progress-mini > div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));}

/* ============ LIST VIEW ============ */
#list-view{padding:1.5rem 1.2rem 5rem;}
.list-row{
  display:grid;
  grid-template-columns:56px 2fr 1fr 90px 130px 150px;
  align-items:center;gap:1rem;
  padding:.7rem 1rem;
  border-bottom:1px solid rgba(203,161,53,.12);
  border-left:3px solid transparent;
  cursor:pointer;transition:all .2s ease;
  border-radius:6px;
}
@media(max-width:900px){
  .list-row{grid-template-columns:44px 1fr 90px; }
  .list-row .col-genre, .list-row .col-pages, .list-row .col-status{display:none;}
}
.list-row:hover{background:rgba(203,161,53,.07);border-left-color:var(--gold);}
.list-cover{width:44px;height:64px;border-radius:2px;object-fit:cover;box-shadow:2px 3px 8px rgba(0,0,0,.5);background:var(--wood-light);}
.list-title{font-family:'Playfair Display',serif;font-size:1rem;color:var(--cream);}
.list-author{font-size:.82rem;color:var(--cream-dim);font-style:italic;}
.badge{
  font-size:.68rem;padding:2px 9px;border-radius:999px;font-weight:600;letter-spacing:.02em;
  display:inline-flex;align-items:center;gap:4px;
}
.badge.read{background:rgba(60,140,100,.18);color:#7fd9a9;border:1px solid rgba(60,140,100,.4);}
.badge.reading{background:rgba(70,140,180,.18);color:#8fd0f0;border:1px solid rgba(70,140,180,.4);}
.badge.unread{background:rgba(150,150,150,.15);color:#c9c9c9;border:1px solid rgba(150,150,150,.35);}
.badge.lent{background:rgba(180,60,60,.18);color:#f0a0a0;border:1px solid rgba(180,60,60,.4);}
.badge.available{background:rgba(203,161,53,.15);color:var(--gold-light);border:1px solid rgba(203,161,53,.4);}

/* ============ MODAL ============ */
#modal-overlay{
  position:fixed;inset:0;z-index:150;
  background:rgba(6,4,2,.8);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:1rem;
}
#modal-panel{
  width:100%;max-width:980px;max-height:92vh;overflow-y:auto;
  background:linear-gradient(160deg,#241810,#150e09);
  border:1px solid rgba(203,161,53,.3);
  border-radius:18px;
  box-shadow:0 30px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(203,161,53,.05) inset;
  display:grid;grid-template-columns:300px 1fr;
}
@media(max-width:768px){#modal-panel{grid-template-columns:1fr;}}
.modal-left{
  padding:2.5rem 1.5rem;display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(circle at 50% 20%, rgba(203,161,53,.08), transparent 65%);
  border-right:1px solid rgba(203,161,53,.15);
}
@media(max-width:768px){.modal-left{border-right:none;border-bottom:1px solid rgba(203,161,53,.15);}}
.modal-book{width:180px;aspect-ratio:2/3;perspective:1500px;margin-bottom:1.5rem;}
.modal-book .book-inner{animation:gentleSway 6s ease-in-out infinite;}
@keyframes gentleSway{
  0%,100%{transform:rotateY(-18deg) rotateX(2deg);}
  50%{transform:rotateY(-6deg) rotateX(0deg);}
}
.modal-right{padding:2.2rem 2.2rem 2.5rem;position:relative;}
.close-btn{
  position:absolute;top:1.2rem;right:1.2rem;
  width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.05);border:1px solid rgba(203,161,53,.3);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .2s ease;z-index:10;
}
.close-btn:hover{background:var(--gold);color:#241608;transform:rotate(90deg);}
.skeleton{
  background:linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.09) 37%, rgba(255,255,255,.04) 63%);
  background-size:400% 100%;
  animation:shimmer 1.4s ease infinite;
  border-radius:6px;
}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}
.info-card{
  background:rgba(255,255,255,.03);border:1px solid rgba(203,161,53,.2);
  border-radius:12px;padding:.9rem 1.1rem;
}
.star{color:#443722;}
.star.filled{color:var(--gold);}

/* Toast */
#toast-container{position:fixed;bottom:1.5rem;right:1.5rem;z-index:300;display:flex;flex-direction:column;gap:.6rem;}
.toast{
  padding:.8rem 1.2rem;border-radius:10px;font-size:.85rem;
  background:rgba(20,14,8,.95);border:1px solid rgba(203,161,53,.4);
  box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:.6rem;
  min-width:220px;
}
.toast.success{border-color:rgba(60,180,120,.5);}
.toast.error{border-color:rgba(220,80,80,.5);}

.loading-spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5rem 1rem;text-align:center;}
</style>
</head>
<body>

<!-- ============ LOCK SCREEN ============ -->
<div id="lockscreen">
  <div class="lock-emblem">
    <i data-lucide="library" style="width:38px;height:38px;color:var(--gold);"></i>
  </div>
  <h1 class="font-display gold-text text-3xl md:text-4xl tracking-wide">ATHENAEUM</h1>
  <p class="text-sm mt-2 text-[var(--cream-dim)] italic tracking-widest">Private Collection · Enter Access Code</p>
  <div id="pin-container">
    <input type="tel" inputmode="numeric" maxlength="1" class="pin-box" data-idx="0">
    <input type="tel" inputmode="numeric" maxlength="1" class="pin-box" data-idx="1">
    <input type="tel" inputmode="numeric" maxlength="1" class="pin-box" data-idx="2">
    <input type="tel" inputmode="numeric" maxlength="1" class="pin-box" data-idx="3">
  </div>
  <p id="pin-error-msg" class="text-red-400 text-xs mt-4 opacity-0 transition-opacity">Incorrect access code. Please try again.</p>
</div>

<!-- ============ MAIN APP ============ -->
<div id="app" class="hidden">
  <header class="top-header px-4 md:px-8 py-4">
    <div class="flex flex-wrap items-center justify-between gap-4 max-w-[1800px] mx-auto">
      <div class="flex items-center gap-3">
        <i data-lucide="book-marked" style="color:var(--gold);width:28px;height:28px;"></i>
        <div>
          <h1 class="font-display gold-text text-xl md:text-2xl leading-none">Athenaeum</h1>
          <p class="text-xs text-[var(--cream-dim)] tracking-widest -mt-0.5">CHRISTINA'S LIBRARY CATALOG</p>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <span class="stat-pill"><i data-lucide="library" class="inline w-3 h-3 mb-0.5"></i> <span id="stat-total">0</span> Books</span>
        <span class="stat-pill"><i data-lucide="book-open" class="inline w-3 h-3 mb-0.5"></i> <span id="stat-reading">0</span> Reading</span>
        <span class="stat-pill"><i data-lucide="handshake" class="inline w-3 h-3 mb-0.5"></i> <span id="stat-lent">0</span> Lent</span>
        <button id="sync-btn" class="btn-gold px-4 py-2 text-sm flex items-center gap-2">
          <i data-lucide="refresh-cw" id="sync-icon" style="width:16px;height:16px;"></i>
          <span>Sync Catalog</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Toolbar -->
  <div class="px-4 md:px-8 py-4 max-w-[1800px] mx-auto flex flex-wrap items-center gap-3">
    <div class="relative flex-1 min-w-[180px]">
      <i data-lucide="search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--cream-dim);"></i>
      <input id="search-input" type="text" placeholder="Search title or author..." class="search-input w-full pl-9 pr-3 py-2 text-sm">
    </div>
    <div class="flex gap-2 overflow-x-auto pb-1" id="filter-chips">
      <div class="chip active" data-filter="all">All</div>
      <div class="chip" data-filter="reading">Reading</div>
      <div class="chip" data-filter="read">Read</div>
      <div class="chip" data-filter="unread">Unread</div>
      <div class="chip" data-filter="lent">Lent Out</div>
    </div>
    <select id="genre-select" class="text-sm px-3 py-2">
      <option value="all">All Genres</option>
    </select>
    <select id="sort-select" class="text-sm px-3 py-2">
      <option value="recent">Recently Added</option>
      <option value="title">Title A–Z</option>
      <option value="pages">Pages (Desc)</option>
    </select>
    <div class="flex gap-1 ml-auto">
      <button id="view-grid-btn" class="btn-ghost active px-3 py-2"><i data-lucide="layout-grid" style="width:16px;height:16px;"></i></button>
      <button id="view-list-btn" class="btn-ghost px-3 py-2"><i data-lucide="list" style="width:16px;height:16px;"></i></button>
    </div>
  </div>

  <main class="max-w-[1800px] mx-auto">
    <div id="grid-view"></div>
    <div id="list-view" class="hidden"></div>
    <div id="empty-state" class="empty-state hidden">
      <i data-lucide="bookmark-x" style="width:60px;height:60px;color:var(--gold);opacity:.5;"></i>
      <h2 class="font-display text-2xl mt-4 text-[var(--cream-dim)]">The shelves are quiet</h2>
      <p class="text-sm text-[var(--cream-dim)] mt-2 max-w-sm">No books match your current filters, or your catalog hasn't been synced yet.</p>
      <button onclick="syncCatalog()" class="btn-gold px-5 py-2.5 mt-5 text-sm">Sync Now</button>
    </div>
  </main>
</div>

<!-- ============ MODAL ============ -->
<div id="modal-overlay" class="hidden">
  <div id="modal-panel"></div>
</div>

<div id="toast-container"></div>

<script>
lucide.createIcons();

/* ============================================================
   CONFIG & STATE
============================================================ */
const CONFIG = {
  endpoint: "https://script.google.com/macros/s/AKfycby1njtHqCEgiQdGe7PfFuxa68UqrfYcmx_Kh-Gdj4Xf_G3i70gXgTz0pX4F8xdofy7GpA/exec",
  email: "christinaslibraryks@gmail.com",
  pinHash: "MDMxNg=="
};

let state = {
  books: [],
  view: 'grid',
  filter: 'all',
  genre: 'all',
  sort: 'recent',
  search: ''
};

/* ============================================================
   PIN LOCK
============================================================ */
const pinInputs = Array.from(document.querySelectorAll('.pin-box'));
const pinContainer = document.getElementById('pin-container');
const pinErrorMsg = document.getElementById('pin-error-msg');

pinInputs.forEach((input, idx) => {
  input.addEventListener('input', () => {
    input.value = input.value.replace(/[^0-9]/g,'').slice(0,1);
    if(input.value && idx < pinInputs.length -1){ pinInputs[idx+1].focus(); }
    checkPinComplete();
  });
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Backspace' && !input.value && idx > 0){ pinInputs[idx-1].focus(); }
  });
});

function checkPinComplete(){
  const val = pinInputs.map(i=>i.value).join('');
  if(val.length === 4){ verifyPin(val); }
}

function verifyPin(val){
  if(btoa(val) === CONFIG.pinHash){
    unlockApp();
  } else {
    failPin();
  }
}

function failPin(){
  pinContainer.classList.add('shake');
  pinInputs.forEach(i => i.classList.add('error-glow'));
  pinErrorMsg.style.opacity = 1;
  if(navigator.vibrate) navigator.vibrate(180);
  setTimeout(() => {
    pinContainer.classList.remove('shake');
    pinInputs.forEach(i => { i.classList.remove('error-glow'); i.value=''; });
    pinInputs[0].focus();
  }, 650);
}

function unlockApp(){
  pinErrorMsg.style.opacity = 0;
  const lock = document.getElementById('lockscreen');
  lock.classList.add('unlocking');
  setTimeout(() => {
    lock.style.display = 'none';
    const app = document.getElementById('app');
    app.classList.remove('hidden');
    gsap.fromTo(app, {opacity:0, scale:.96, y:20}, {opacity:1, scale:1, y:0, duration:1.1, ease:'power3.out'});
    syncCatalog();
  }, 1050);
}

setTimeout(()=>pinInputs[0] && pinInputs[0].focus(), 400);

/* ============================================================
   TOAST
============================================================ */
function showToast(msg, type='success'){
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icon = type==='success' ? 'check-circle' : (type==='error' ? 'alert-triangle' : 'info');
  el.innerHTML = `<i data-lucide="${icon}" style="width:16px;height:16px;flex-shrink:0;color:${type==='success'?'#7fd9a9':'#f0a0a0'}"></i><span>${msg}</span>`;
  container.appendChild(el);
  lucide.createIcons();
  gsap.fromTo(el, {opacity:0, x:40}, {opacity:1, x:0, duration:.4});
  setTimeout(() => {
    gsap.to(el, {opacity:0, x:40, duration:.4, onComplete:()=>el.remove()});
  }, 3800);
}

/* ============================================================
   DATA SYNC
============================================================ */
const syncBtn = document.getElementById('sync-btn');
const syncIcon = document.getElementById('sync-icon');

async function syncCatalog(){
  setSyncing(true);
  try{
    const response = await fetch(CONFIG.endpoint, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "SYNC", email: CONFIG.email, books: [] })
    });
    const data = await response.json();
    const rawBooks = data.books || [];
    state.books = rawBooks.filter(b => b.status !== "Deleted" && b.isdeleted !== true && b.isDeleted !== true);
    showToast(`Catalog synced — ${state.books.length} books loaded.`, 'success');
    populateGenreOptions();
  } catch(err){
    console.error(err);
    showToast('Sync failed. Check your connection.', 'error');
  } finally {
    setSyncing(false);
    applyFiltersAndSort();
  }
}

function setSyncing(isSyncing){
  if(isSyncing){
    syncIcon.classList.add('loading-spin');
    syncBtn.disabled = true;
    syncBtn.style.opacity = .7;
  } else {
    syncIcon.classList.remove('loading-spin');
    syncBtn.disabled = false;
    syncBtn.style.opacity = 1;
  }
}
syncBtn.addEventListener('click', syncCatalog);

/* ============================================================
   GENRE + FILTER + SORT CONTROLS
============================================================ */
function populateGenreOptions(){
  const select = document.getElementById('genre-select');
  const genres = Array.from(new Set(state.books.map(b => (b.genre||'').trim()).filter(Boolean))).sort();
  select.innerHTML = `<option value="all">All Genres</option>` + genres.map(g => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('');
}

document.getElementById('search-input').addEventListener('input', debounce((e) => {
  state.search = e.target.value.trim().toLowerCase();
  applyFiltersAndSort();
}, 250));

document.querySelectorAll('#filter-chips .chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#filter-chips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.filter = chip.dataset.filter;
    applyFiltersAndSort();
  });
});

document.getElementById('genre-select').addEventListener('change', (e) => {
  state.genre = e.target.value;
  applyFiltersAndSort();
});

document.getElementById('sort-select').addEventListener('change', (e) => {
  state.sort = e.target.value;
  applyFiltersAndSort();
});

document.getElementById('view-grid-btn').addEventListener('click', () => setView('grid'));
document.getElementById('view-list-btn').addEventListener('click', () => setView('list'));

function setView(view){
  state.view = view;
  document.getElementById('view-grid-btn').classList.toggle('active', view==='grid');
  document.getElementById('view-list-btn').classList.toggle('active', view==='list');
  document.getElementById('grid-view').classList.toggle('hidden', view!=='grid');
  document.getElementById('list-view').classList.toggle('hidden', view!=='list');
  applyFiltersAndSort();
}

function debounce(fn, delay){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), delay); };
}

function escapeHtml(str){
  if(str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============================================================
   FILTER + SORT + RENDER PIPELINE
============================================================ */
function applyFiltersAndSort(){
  let list = [...state.books];

  if(state.search){
    list = list.filter(b =>
      (b.title||'').toLowerCase().includes(state.search) ||
      (b.authors||'').toLowerCase().includes(state.search)
    );
  }

  if(state.filter === 'reading') list = list.filter(b => (b.readstatus||'').toLowerCase() === 'reading');
  else if(state.filter === 'read') list = list.filter(b => (b.readstatus||'').toLowerCase() === 'read');
  else if(state.filter === 'unread') list = list.filter(b => (b.readstatus||'').toLowerCase() === 'unread');
  else if(state.filter === 'lent') list = list.filter(b => (b.lendingstatus||'').toLowerCase() === 'lent');

  if(state.genre !== 'all') list = list.filter(b => (b.genre||'') === state.genre);

  if(state.sort === 'title') list.sort((a,b) => (a.title||'').localeCompare(b.title||''));
  else if(state.sort === 'pages') list.sort((a,b) => (parseInt(b.pages)||0) - (parseInt(a.pages)||0));
  else list.sort((a,b) => (parseInt(b.id)||0) - (parseInt(a.id)||0));

  renderBooks(list);
  updateStats();
}

function updateStats(){
  document.getElementById('stat-total').textContent = state.books.length;
  document.getElementById('stat-reading').textContent = state.books.filter(b => (b.readstatus||'').toLowerCase()==='reading').length;
  document.getElementById('stat-lent').textContent = state.books.filter(b => (b.lendingstatus||'').toLowerCase()==='lent').length;
}

/* ============================================================
   RENDER — GRID / LIST with FLIP animation
============================================================ */
function renderBooks(list){
  document.getElementById('empty-state').classList.toggle('hidden', list.length > 0 || state.books.length === 0 ? list.length > 0 : false);
  document.getElementById('empty-state').classList.toggle('hidden', list.length > 0);

  const target = state.view === 'grid' ? document.getElementById('grid-view') : document.getElementById('list-view');
  const other = state.view === 'grid' ? document.getElementById('list-view') : document.getElementById('grid-view');
  other.innerHTML = '';

  const oldRects = {};
  target.querySelectorAll('[data-id]').forEach(el => { oldRects[el.dataset.id] = el.getBoundingClientRect(); });

  target.innerHTML = list.map(b => state.view === 'grid' ? bookCardHTML(b) : bookRowHTML(b)).join('');
  lucide.createIcons();

  target.querySelectorAll('[data-id]').forEach(el => {
    const id = el.dataset.id;
    const newRect = el.getBoundingClientRect();
    if(oldRects[id]){
      const dx = oldRects[id].left - newRect.left;
      const dy = oldRects[id].top - newRect.top;
      if(dx || dy){
        gsap.fromTo(el, {x:dx, y:dy}, {x:0, y:0, duration:.65, ease:'power3.out'});
      }
    } else {
      gsap.fromTo(el, {opacity:0, y:24, scale:.9}, {opacity:1, y:0, scale:1, duration:.5, delay: Math.random()*.25, ease:'power2.out'});
    }
    el.addEventListener('click', () => openModal(id));
  });

  if(state.view === 'grid') attachTiltHandlers();
}

function getStatusBadge(readstatus){
  const s = (readstatus||'unread').toLowerCase();
  const label = readstatus || 'Unread';
  const cls = s === 'reading' ? 'reading' : s === 'read' ? 'read' : 'unread';
  const icon = s === 'reading' ? 'book-open' : s === 'read' ? 'check' : 'bookmark';
  return `<span class="badge ${cls}"><i data-lucide="${icon}" style="width:11px;height:11px;"></i>${escapeHtml(label)}</span>`;
}
function getLendingBadge(lendingstatus, borrower){
  const isLent = (lendingstatus||'').toLowerCase() === 'lent';
  if(isLent){
    return `<span class="badge lent"><i data-lucide="handshake" style="width:11px;height:11px;"></i>${escapeHtml(borrower||'Lent')}</span>`;
  }
  return `<span class="badge available"><i data-lucide="check-circle" style="width:11px;height:11px;"></i>Available</span>`;
}

function bookCardHTML(b){
  const cover = b.coverurl || b.coverUrl || '';
  const readstatus = (b.readstatus||'').toLowerCase();
  const isLent = (b.lendingstatus||'').toLowerCase() === 'lent';
  const pages = parseInt(b.pages)||0;
  const currentpage = parseInt(b.currentpage)||0;
  const pct = pages > 0 ? Math.min(100, Math.round((currentpage/pages)*100)) : 0;

  const coverContent = cover
    ? `<img class="cover-img" src="${escapeHtml(cover)}" alt="${escapeHtml(b.title)}" onerror="this.parentElement.innerHTML='<div class=\\'no-cover\\'><span>${escapeHtml(b.title||'Untitled')}</span></div>'">`
    : `<div class="no-cover"><span>${escapeHtml(b.title||'Untitled')}</span></div>`;

  return `
  <div class="book-item" data-id="${b.id}">
    <div class="book-inner">
      <div class="face-spine"></div>
      <div class="face-pages"></div>
      <div class="face-front">
        ${coverContent}
        <div class="sheen"></div>
      </div>
      ${isLent ? `<div class="ribbon lent">Lent</div>` : (readstatus==='reading' ? `<div class="ribbon reading">Reading</div>` : '')}
    </div>
    <div class="book-meta">
      <h3>${escapeHtml(b.title||'Untitled')}</h3>
      <p>${escapeHtml(b.authors||'Unknown Author')}</p>
      ${readstatus==='reading' && pages>0 ? `<div class="progress-mini"><div style="width:${pct}%"></div></div>` : ''}
    </div>
  </div>`;
}

function bookRowHTML(b){
  const cover = b.coverurl || b.coverUrl || '';
  const pages = parseInt(b.pages)||0;
  const currentpage = parseInt(b.currentpage)||0;
  return `
  <div class="list-row" data-id="${b.id}">
    <img class="list-cover" src="${escapeHtml(cover)}" onerror="this.style.visibility='hidden'" alt="">
    <div>
      <div class="list-title">${escapeHtml(b.title||'Untitled')}</div>
      <div class="list-author">${escapeHtml(b.authors||'Unknown Author')}</div>
    </div>
    <div class="col-genre text-sm text-[var(--cream-dim)]">${escapeHtml(b.genre||'—')}</div>
    <div class="col-pages text-sm text-[var(--cream-dim)]">${pages ? (currentpage ? currentpage+' / '+pages : pages+' pg') : '—'}</div>
    <div class="col-status">${getStatusBadge(b.readstatus)}</div>
    <div>${getLendingBadge(b.lendingstatus, b.borrower)}</div>
  </div>`;
}

/* ============================================================
   3D TILT + SHEEN INTERACTION (Grid Mode)
============================================================ */
function attachTiltHandlers(){
  document.querySelectorAll('.book-item').forEach(card => {
    const inner = card.querySelector('.book-inner');
    const sheen = card.querySelector('.sheen');
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      const rotY = (x - 0.5) * 42 - 8;
      const rotX = (0.5 - y) * 24;
      inner.style.transition = 'transform .08s linear';
      inner.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg) scale(1.09)`;
      if(sheen){
        sheen.style.background = `radial-gradient(circle at ${x*100}% ${y*100}%, rgba(255,255,255,.55), transparent 55%)`;
        sheen.style.opacity = 1;
      }
    });
    card.addEventListener('mouseleave', () => {
      inner.style.transition = 'transform .55s cubic-bezier(.16,1,.3,1)';
      inner.style.transform = '';
      if(sheen) sheen.style.opacity = 0;
    });
  });
}

/* ============================================================
   MODAL — Full Book Experience
============================================================ */
const modalOverlay = document.getElementById('modal-overlay');
const modalPanel = document.getElementById('modal-panel');

function openModal(id){
  const book = state.books.find(b => String(b.id) === String(id));
  if(!book) return;

  const cover = book.coverurl || book.coverUrl || '';
  const pages = parseInt(book.pages)||0;
  const currentpage = parseInt(book.currentpage)||0;
  const pct = pages > 0 ? Math.min(100, Math.round((currentpage/pages)*100)) : 0;
  const rating = parseInt(book.rating || book.personalrating || book.myrating || 0) || 0;
  const isLent = (book.lendingstatus||'').toLowerCase() === 'lent';

  const starsHTML = (count, max=5) => Array.from({length:max}).map((_,i) =>
    `<i data-lucide="star" class="star ${i < count ? 'filled':''}" style="width:16px;height:16px;fill:${i<count?'currentColor':'none'}"></i>`
  ).join('');

  const coverContent = cover
    ? `<img class="cover-img" src="${escapeHtml(cover)}" alt="" onerror="this.parentElement.innerHTML='<div class=\\'no-cover\\'><span style=\\'font-size:1rem\\'>${escapeHtml(book.title||'')}</span></div>'">`
    : `<div class="no-cover"><span style="font-size:1rem">${escapeHtml(book.title||'')}</span></div>`;

  modalPanel.innerHTML = `
    <div class="close-btn" onclick="closeModal()"><i data-lucide="x" style="width:18px;height:18px;"></i></div>
    <div class="modal-left">
      <div class="modal-book">
        <div class="book-inner">
          <div class="face-spine"></div>
          <div class="face-pages"></div>
          <div class="face-front">${coverContent}</div>
        </div>
      </div>
      <div class="w-full space-y-3 mt-2">
        <div class="info-card">
          <p class="text-xs text-[var(--cream-dim)] mb-1 tracking-widest">PERSONAL RATING</p>
          <div class="flex gap-1">${starsHTML(rating)}</div>
        </div>
        ${pages > 0 ? `
        <div class="info-card">
          <p class="text-xs text-[var(--cream-dim)] mb-1 tracking-widest">READING PROGRESS</p>
          <div class="flex justify-between text-sm mb-1"><span>${currentpage||0} / ${pages} pages</span><span class="text-[var(--gold-light)]">${pct}%</span></div>
          <div class="progress-mini" style="height:6px;"><div style="width:${pct}%"></div></div>
        </div>` : ''}
        <div class="info-card">
          <p class="text-xs text-[var(--cream-dim)] mb-1 tracking-widest">LENDING STATUS</p>
          ${isLent ? `
            <div class="flex items-center gap-2 text-sm"><i data-lucide="user" style="width:14px;height:14px;color:var(--gold-light)"></i> ${escapeHtml(book.borrower||'Unknown')}</div>
            <div class="flex items-center gap-2 text-xs text-[var(--cream-dim)] mt-1"><i data-lucide="calendar" style="width:12px;height:12px;"></i> Since ${escapeHtml(book.datelent||'—')}</div>
          ` : `<div class="flex items-center gap-2 text-sm text-[var(--gold-light)]"><i data-lucide="check-circle" style="width:14px;height:14px;"></i> On the shelf</div>`}
        </div>
      </div>
    </div>
    <div class="modal-right">
      <p class="text-xs tracking-[0.2em] text-[var(--gold)] mb-1">${escapeHtml(book.genre||'GENERAL')}</p>
      <h2 class="font-display text-3xl md:text-4xl text-[var(--cream)] leading-tight pr-8">${escapeHtml(book.title||'Untitled')}</h2>
      <p class="text-lg italic text-[var(--cream-dim)] mt-1 mb-4">by ${escapeHtml(book.authors||'Unknown Author')}</p>

      ${book.comment ? `
      <div class="mb-5 p-4 rounded-lg" style="background:rgba(203,161,53,.06);border:1px dashed rgba(203,161,53,.35);">
        <p class="text-xs tracking-widest text-[var(--gold-light)] mb-1 flex items-center gap-1"><i data-lucide="pen-line" style="width:12px;height:12px;"></i> PERSONAL NOTE</p>
        <p class="font-hand text-xl leading-snug text-[var(--cream)]">"${escapeHtml(book.comment)}"</p>
      </div>` : ''}

      <div class="border-t border-[rgba(203,161,53,.15)] pt-4 mt-2">
        <p class="text-xs tracking-widest text-[var(--gold)] mb-2 flex items-center gap-2">
          <i data-lucide="sparkles" style="width:13px;height:13px;"></i> ABOUT THIS BOOK
        </p>
        <div id="modal-blurb-container">
          <div class="skeleton" style="height:14px;width:100%;margin-bottom:8px;"></div>
          <div class="skeleton" style="height:14px;width:95%;margin-bottom:8px;"></div>
          <div class="skeleton" style="height:14px;width:80%;margin-bottom:8px;"></div>
          <div class="skeleton" style="height:14px;width:60%;"></div>
        </div>
        <div id="modal-extra-container" class="mt-4 flex flex-wrap gap-2">
          <div class="skeleton" style="height:26px;width:90px;border-radius:999px;"></div>
          <div class="skeleton" style="height:26px;width:120px;border-radius:999px;"></div>
        </div>
      </div>
    </div>
  `;

  lucide.createIcons();
  modalOverlay.classList.remove('hidden');
  gsap.fromTo(modalOverlay, {opacity:0}, {opacity:1, duration:.35});
  gsap.fromTo(modalPanel, {opacity:0, y:40, scale:.94}, {opacity:1, y:0, scale:1, duration:.55, ease:'power3.out'});

  fetchExternalDetails(book);
}

function closeModal(){
  gsap.to(modalPanel, {opacity:0, y:30, scale:.95, duration:.35, ease:'power2.in'});
  gsap.to(modalOverlay, {opacity:0, duration:.4, delay:.05, onComplete: () => {
    modalOverlay.classList.add('hidden');
    modalPanel.innerHTML = '';
  }});
}
modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && !modalOverlay.classList.contains('hidden')) closeModal(); });

/* ============================================================
   DYNAMIC EXTERNAL METADATA (Google Books / OpenLibrary)
============================================================ */
async function fetchExternalDetails(book){
  const isbn = (book.isbnuid || book.isbnUid || '').toString().trim();
  const blurbContainer = document.getElementById('modal-blurb-container');
  const extraContainer = document.getElementById('modal-extra-container');
  if(!blurbContainer) return;

  if(!isbn){
    blurbContainer.innerHTML = `<p class="text-sm text-[var(--cream-dim)] italic">No ISBN on file — extended details unavailable for this edition.</p>`;
    extraContainer.innerHTML = '';
    return;
  }

  try{
    const [gResult, oResult] = await Promise.allSettled([
      fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${encodeURIComponent(isbn)}`).then(r => r.json()),
      fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${encodeURIComponent(isbn)}&jscmd=data&format=json`).then(r => r.json())
    ]);

    let blurb = null, extRating = null, categories = [], pageCount = null;

    if(gResult.status === 'fulfilled' && gResult.value.items && gResult.value.items.length){
      const vi = gResult.value.items[0].volumeInfo || {};
      blurb = vi.description || null;
      extRating = vi.averageRating || null;
      categories = vi.categories || [];
      pageCount = vi.pageCount || null;
    }

    if(oResult.status === 'fulfilled'){
      const key = 'ISBN:' + isbn;
      const od = oResult.value ? oResult.value[key] : null;
      if(od){
        if(!blurb && od.excerpts && od.excerpts.length) blurb = od.excerpts[0].text;
        if(!blurb && od.notes) blurb = typeof od.notes === 'string' ? od.notes : od.notes.value;
        if(!categories.length && od.subjects) categories = od.subjects.slice(0,5).map(s => s.name);
        if(!pageCount && od.number_of_pages) pageCount = od.number_of_pages;
      }
    }

    renderExternalDetails({blurb, extRating, categories, pageCount});

  } catch(err){
    console.error(err);
    blurbContainer.innerHTML = `<p class="text-sm text-red-300 italic">Could not reach external catalog services.</p>`;
    extraContainer.innerHTML = '';
  }
}

function renderExternalDetails({blurb, extRating, categories, pageCount}){
  const blurbContainer = document.getElementById('modal-blurb-container');
  const extraContainer = document.getElementById('modal-extra-container');
  if(!blurbContainer) return;

  const cleanBlurb = blurb ? blurb.replace(/<[^>]+>/g,'') : null;

  blurbContainer.innerHTML = `<p class="text-sm leading-relaxed text-[var(--cream-dim)]" style="opacity:0;">${escapeHtml(cleanBlurb) || 'No synopsis available for this edition.'}</p>`;
  gsap.to(blurbContainer.firstElementChild, {opacity:1, duration:.6});

  let extraHTML = '';
  if(extRating){
    extraHTML += `<div class="chip flex items-center gap-1" style="cursor:default;"><i data-lucide="star" style="width:12px;height:12px;color:var(--gold);fill:var(--gold);"></i> ${extRating} / 5 (Google Books)</div>`;
  }
  if(pageCount){
    extraHTML += `<div class="chip flex items-center gap-1" style="cursor:default;"><i data-lucide="file-text" style="width:12px;height:12px;"></i> ${pageCount} pages</div>`;
  }
  if(categories && categories.length){
    categories.slice(0,4).forEach(cat => {
      extraHTML += `<div class="chip" style="cursor:default;">${escapeHtml(cat)}</div>`;
    });
  }
  extraContainer.innerHTML = extraHTML;
  lucide.createIcons();
  gsap.fromTo(extraContainer.children, {opacity:0, y:8}, {opacity:1, y:0, duration:.4, stagger:.06});
}
