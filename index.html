<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christina's Library</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --accent: #e94560;
            --text: #eee;
            --text-secondary: #aaa;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.43);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 1rem;
        }

        /* Header / Toolbar */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--surface);
            border-radius: var(--radius);
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0.5rem;
            z-index: 10;
        }
        .library-title {
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .search-input {
            flex: 1 1 200px;
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 8px;
            background: #2a2a4a;
            color: var(--text);
            font-size: 1rem;
            min-width: 150px;
        }
        .search-input::placeholder {
            color: #888;
        }
        .btn-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .btn {
            background: #2a2a4a;
            border: none;
            color: var(--text);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn:hover {
            background: var(--accent);
        }
        .btn.active {
            background: var(--accent);
            font-weight: bold;
        }
        .admin-btn {
            margin-left: auto;
            font-size: 1.4rem;
            padding: 0.5rem;
        }

        /* Main content */
        .books-container {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            padding: 0 0.5rem;
        }

        /* Grid layout */
        .grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 1.5rem;
            justify-content: center;
        }
        .grid-view .book-card {
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            background: transparent;
            border-radius: 8px;
            overflow: hidden;
        }
        .grid-view .book-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.35);
        }
        .grid-view .book-cover-img {
            width: 100%;
            height: auto;
            aspect-ratio: 2/3;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }
        .book-title-grid {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            font-weight: 500;
            color: var(--text);
        }
        /* List layout */
        .list-view {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .list-view .book-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--surface);
            padding: 0.8rem;
            border-radius: var(--radius);
            transition: background 0.2s;
            cursor: pointer;
        }
        .list-view .book-card:hover {
            background: #2a2a4a;
        }
        .list-view .book-cover-img {
            width: 70px;
            height: 100px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .list-view .book-info-list {
            flex: 1;
        }
        .list-view .book-title-list {
            font-weight: 600;
            font-size: 1.1rem;
        }
        .list-view .book-author {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Modal overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 1rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 700px;
            width: 100%;
            padding: 2rem;
            position: relative;
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-close {
            position: absolute;
            top: 0.8rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 5;
        }
        .modal-book-meta {
            flex: 1 1 200px;
        }
        .modal-book-meta h2 {
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }
        .modal-book-meta .author {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }
        .modal-book-meta .pages {
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        .modal-book-meta .description {
            color: #ccc;
            line-height: 1.5;
        }

        /* 3D book scene – only used in detail modal */
        .scene {
            flex: 1 1 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            perspective-origin: 50% 50%;
        }
        .book3d-container {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .book3d {
            position: relative;
            width: var(--w);
            height: var(--h);
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
            transform: rotateY(var(--rotate));
        }
        .face {
            position: absolute;
            backface-visibility: hidden;
            background-size: cover;
            background-position: center;
            border-radius: 2px;
        }
        .front, .back {
            width: var(--w);
            height: var(--h);
            background-repeat: no-repeat;
            background-size: cover;
            border-radius: 4px;
        }
        .front {
            transform: translateZ(calc(var(--t) / 2));
            background-image: var(--front-img);
        }
        .back {
            transform: rotateY(180deg) translateZ(calc(var(--t) / 2));
            background-image: var(--back-img);
        }
        .spine {
            left: 0; top: 0;
            width: var(--t);
            height: var(--h);
            background: linear-gradient(to right, #5c3a1e, #3a2a1a);
            transform: rotateY(-90deg) translateZ(calc(var(--w) - var(--t) / 2));
            transform-origin: left center;
        }
        .pages-edge {
            right: 0; top: 0;
            width: var(--t);
            height: var(--h);
            background: repeating-linear-gradient(
                to bottom,
                #f4ecd8 0px,
                #f4ecd8 2px,
                #d4c9a8 2px,
                #d4c9a8 3px
            );
            transform: rotateY(90deg) translateZ(calc(var(--w) - var(--t) / 2));
            transform-origin: right center;
        }
        .top, .bottom {
            left: 0;
            width: var(--w);
            height: var(--t);
            background: #4a3a2a;
            transform: rotateX(90deg) translateZ(calc(var(--h) - var(--t) / 2));
        }
        .top {
            top: 0;
        }
        .bottom {
            bottom: 0;
            transform: rotateX(-90deg) translateZ(calc(var(--h) - var(--t) / 2));
        }

        .flip-btn {
            margin-top: 1rem;
            background: var(--accent);
            border: none;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: filter 0.2s;
        }
        .flip-btn:hover {
            filter: brightness(1.2);
        }

        /* Admin PIN modal */
        .pin-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
        }
        .pin-modal.active {
            opacity: 1;
            visibility: visible;
        }
        .pin-box {
            background: var(--surface);
            padding: 2rem;
            border-radius: var(--radius);
            text-align: center;
            width: 280px;
            box-shadow: var(--shadow);
        }
        .pin-box h3 {
            margin-bottom: 1rem;
        }
        .pin-input {
            padding: 0.7rem;
            width: 100%;
            border: none;
            border-radius: 6px;
            background: #2a2a4a;
            color: white;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            text-align: center;
            letter-spacing: 0.3em;
            -webkit-text-security: disc; /* additional mask */
            font-family: monospace;
        }
        .pin-input::placeholder {
            letter-spacing: normal;
        }
        .pin-submit {
            background: var(--accent);
            border: none;
            color: white;
            padding: 0.7rem 1.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .modal-content {
                flex-direction: column;
                align-items: center;
            }
            .scene {
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Toolbar -->
    <header class="toolbar">
        <span class="library-title">📚 Christina’s Library</span>
        <input type="text" class="search-input" placeholder="Search books..." id="searchInput">
        <div class="btn-group">
            <button class="btn active" id="gridViewBtn" title="Grid view">🔲 Grid</button>
            <button class="btn" id="listViewBtn" title="List view">📋 List</button>
        </div>
        <button class="btn admin-btn" id="adminBtn" title="Admin">🔐</button>
    </header>

    <!-- Book grid/list -->
    <div class="books-container" id="booksContainer"></div>

    <!-- Book Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" id="closeModalBtn">✖</button>
            <div class="scene" id="bookScene">
                <div class="book3d-container">
                    <div class="book3d" id="book3d">
                        <div class="face front"></div>
                        <div class="face back"></div>
                        <div class="face spine"></div>
                        <div class="face pages-edge"></div>
                        <div class="face top"></div>
                        <div class="face bottom"></div>
                    </div>
                </div>
                <button class="flip-btn" id="flipBtn">↻ Flip Cover</button>
            </div>
            <div class="modal-book-meta">
                <h2 id="modalTitle"></h2>
                <p class="author" id="modalAuthor"></p>
                <p class="pages">📖 <span id="modalPages"></span> pages</p>
                <p class="description" id="modalDesc"></p>
            </div>
        </div>
    </div>

    <!-- Admin PIN Modal -->
    <div class="pin-modal" id="pinModal">
        <div class="pin-box">
            <h3>Admin PIN</h3>
            <input type="password" class="pin-input" id="pinInput" placeholder="••••" maxlength="6" inputmode="numeric">
            <button class="pin-submit" id="pinSubmit">Unlock</button>
        </div>
    </div>

    <script>
        // ---- SAMPLE LIBRARY DATA ----
        // Replace with your actual catalogue or fetch from a JSON file.
        const books = [
            {
                id: 1,
                title: "The Great Gatsby",
                author: "F. Scott Fitzgerald",
                pages: 180,
                coverFront: "covers/book1.jpg",
                coverBack: "covers/book1-back.jpg",
                description: "A story of the fabulously wealthy Jay Gatsby and his love for the beautiful Daisy Buchanan."
            },
            {
                id: 2,
                title: "To Kill a Mockingbird",
                author: "Harper Lee",
                pages: 281,
                coverFront: "covers/book2.jpg",
                coverBack: "covers/book2-back.jpg",
                description: "The unforgettable novel of a childhood in a sleepy Southern town and the crisis of conscience that rocked it."
            },
            {
                id: 3,
                title: "1984",
                author: "George Orwell",
                pages: 328,
                coverFront: "covers/book3.jpg",
                coverBack: "covers/book3-back.jpg",
                description: "A dystopian social science fiction novel and cautionary tale about the future of totalitarianism."
            },
            {
                id: 4,
                title: "Pride and Prejudice",
                author: "Jane Austen",
                pages: 432,
                coverFront: "covers/book4.jpg",
                coverBack: "covers/book4-back.jpg",
                description: "A romantic novel of manners that follows the character development of Elizabeth Bennet."
            },
            {
                id: 5,
                title: "Moby Dick",
                author: "Herman Melville",
                pages: 635,
                coverFront: "covers/book5.jpg",
                coverBack: "covers/book5-back.jpg",
                description: "The saga of Captain Ahab and his relentless pursuit of the great white whale."
            },
            {
                id: 6,
                title: "War and Peace",
                author: "Leo Tolstoy",
                pages: 1225,
                coverFront: "covers/book6.jpg",
                coverBack: "covers/book6-back.jpg",
                description: "A panoramic study of early 19th‑century Russian society, noted for its mastery of realistic detail."
            }
        ];

        const booksContainer = document.getElementById('booksContainer');
        const searchInput = document.getElementById('searchInput');
        const gridViewBtn = document.getElementById('gridViewBtn');
        const listViewBtn = document.getElementById('listViewBtn');
        const detailModal = document.getElementById('detailModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const bookScene = document.getElementById('bookScene');
        const book3d = document.getElementById('book3d');
        const flipBtn = document.getElementById('flipBtn');
        const modalTitle = document.getElementById('modalTitle');
        const modalAuthor = document.getElementById('modalAuthor');
        const modalPages = document.getElementById('modalPages');
        const modalDesc = document.getElementById('modalDesc');
        const adminBtn = document.getElementById('adminBtn');
        const pinModal = document.getElementById('pinModal');
        const pinInput = document.getElementById('pinInput');
        const pinSubmit = document.getElementById('pinSubmit');

        let currentView = 'grid'; // 'grid' or 'list'
        let currentFlip = 0; // 0 = front, 1 = back

        // Render books based on search & view
        function renderBooks() {
            const searchTerm = searchInput.value.trim().toLowerCase();
            const filtered = books.filter(b =>
                b.title.toLowerCase().includes(searchTerm) ||
                b.author.toLowerCase().includes(searchTerm)
            );

            booksContainer.innerHTML = '';
            booksContainer.className = currentView === 'grid' ? 'grid-view' : 'list-view';

            if (filtered.length === 0) {
                booksContainer.innerHTML = '<p style="text-align:center; padding:2rem;">No books found.</p>';
                return;
            }

            filtered.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = currentView === 'grid'
                    ? `<img class="book-cover-img" src="${book.coverFront}" alt="${book.title}" loading="lazy">
                       <div class="book-title-grid">${book.title}</div>`
                    : `<img class="book-cover-img" src="${book.coverFront}" alt="${book.title}" loading="lazy">
                       <div class="book-info-list">
                           <div class="book-title-list">${book.title}</div>
                           <div class="book-author">${book.author}</div>
                       </div>`;
                card.addEventListener('click', () => openDetail(book));
                booksContainer.appendChild(card);
            });
        }

        // Open detail modal with 3D book
        function openDetail(book) {
            modalTitle.textContent = book.title;
            modalAuthor.textContent = book.author;
            modalPages.textContent = book.pages;
            modalDesc.textContent = book.description;

            // Calculate thickness based on page count (minimum 4px, max 40px)
            const thickness = Math.max(4, Math.min(40, book.pages * 0.08));
            const bookWidth = 220; // px width of cover in scene
            const bookHeight = 330; // px height

            // Set CSS custom properties for the 3D book
            book3d.style.setProperty('--w', `${bookWidth}px`);
            book3d.style.setProperty('--h', `${bookHeight}px`);
            book3d.style.setProperty('--t', `${thickness}px`);
            book3d.style.setProperty('--front-img', `url(${book.coverFront})`);
            book3d.style.setProperty('--back-img', `url(${book.coverBack})`);
            currentFlip = 0;
            book3d.style.setProperty('--rotate', '0deg');

            detailModal.classList.add('active');
        }

        function closeDetail() {
            detailModal.classList.remove('active');
        }

        // Flip the 3D book
        flipBtn.addEventListener('click', () => {
            currentFlip = currentFlip === 0 ? 1 : 0;
            const rotation = currentFlip === 0 ? '0deg' : '-180deg';
            book3d.style.setProperty('--rotate', rotation);
        });

        closeModalBtn.addEventListener('click', closeDetail);
        detailModal.addEventListener('click', (e) => {
            if (e.target === detailModal) closeDetail();
        });

        // View toggle
        gridViewBtn.addEventListener('click', () => {
            currentView = 'grid';
            gridViewBtn.classList.add('active');
            listViewBtn.classList.remove('active');
            renderBooks();
        });
        listViewBtn.addEventListener('click', () => {
            currentView = 'list';
            listViewBtn.classList.add('active');
            gridViewBtn.classList.remove('active');
            renderBooks();
        });

        searchInput.addEventListener('input', renderBooks);

        // Admin PIN (now masked)
        adminBtn.addEventListener('click', () => {
            pinInput.value = '';
            pinModal.classList.add('active');
            pinInput.focus();
        });

        pinSubmit.addEventListener('click', () => {
            const pin = pinInput.value;
            // Replace '1234' with your actual PIN
            if (pin === '1234') {
                alert('✅ Admin access granted.\n(You can now manage your library.)');
                pinModal.classList.remove('active');
                // Here you could show an admin panel.
            } else {
                alert('❌ Incorrect PIN');
                pinInput.value = '';
            }
        });

        pinInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') pinSubmit.click();
        });

        // Close PIN modal on overlay click
        pinModal.addEventListener('click', (e) => {
            if (e.target === pinModal) pinModal.classList.remove('active');
        });

        // Initial render
        renderBooks();
    </script>
</body>
</html>
